[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pkgtruth"
version = "0.1.0"
description = "Evidence-backed comparison of local wheels and explicitly mapped source"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1.6,<4", "python-multipart>=0.0.20,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "build>=1.2,<2"]

[project.scripts]
pkgtruth = "pkgtruth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pkgtruth = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
