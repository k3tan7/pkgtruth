name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install built package and test dependencies
        run: python -m pip install "$(ls dist/*.whl)[test]"
      - name: Test installed package outside checkout
        working-directory: /tmp
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -q
      - name: Validate installed CLI and app
        working-directory: /tmp
        run: |
          pkgtruth --help
          pkgtruth --version
          python -c "from pkgtruth.web import app; assert app.title == 'pkgtruth'"
      - name: Validate deterministic examples and schema
        run: |
          python examples/generate.py
          git diff --exit-code -- examples docs/report.schema.json
